# False Alarm's game.conf (hornet-web kitten/deploy/game.conf.example has every key). deploy/deploy.sh is
# kitten's shim: it runs kitten/deploy/game-deploy.sh for this repo. False Alarm doesn't vendor kitten, so
# point at it:
#
#   GAME_DEPLOY=~/Documents/Sterling-Documents-Sync/hornet-web/kitten/deploy/game-deploy.sh deploy/deploy.sh plan
#
# The page: sterlinghirsh.com/false-alarm/ on the cPanel host (package.json "homepage" sets CRA's PUBLIC_URL).
# The server: src/server/server.js, bundled by esbuild, at https://false-alarm.<RT_DOMAIN>/socket.io/ on
# realtime-1, port 7102 (sterlinghirsh.com deploy/rt/ports).

GAME=false-alarm
TEST='npm test'
LOCAL_STAGE_DIR=.tmp/deploy

STATIC_TARGET=cpanel
CPANEL_DIR=false-alarm
BASE_PATH=/false-alarm/
CPANEL_EXT='html js css json txt ico svg png'
STATIC_DIR=build
# The server's origin is baked into the page.
CLIENT_BUILD='REACT_APP_SOCKET_URL="$REALTIME_ORIGIN" npm run build'
HEADERS=plain
# CRA names hashed files main.<hash>.js, not the -<hash> the immutable check wants; no year-long caching.
HASHED_DIR=

# --- the server: false-alarm.<RT_DOMAIN> on realtime-1
PORT=7102
RUNTIME=node
NODE_MAJOR=24
# One CommonJS file with socket.io inlined; the host never runs npm install.
SERVER_BUILD='node scripts/bundle-server.mjs --out "$OUT"'
# It reads PORT, HOST, ALLOWED_ORIGINS and BUILD_ID from the unit's environment.
START='$NODE --enable-source-maps server/main.cjs'
VALIDATE=server/main.cjs
HEALTH=/health
HEALTH_MATCH=build
WS_PATHS='/socket.io/*'
ORIGIN_CHECK=server

# All state in memory; idle games and players are swept. A few tens of MB in use.
MEMORY_MAX=256M
TASKS_MAX=64
CPU_WEIGHT=100
NOFILE=4096
RESTART=always
